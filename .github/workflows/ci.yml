name: CI

# Every pull request, including one from a fork, gets the full set of checks
# below with a read-only token and no secrets. Nothing here uses
# `pull_request_target`, so code from a fork never runs with write access.
on:
  pull_request:
  push:
    branches: [main]

# A newer push to a pull request supersedes the run before it. Runs on main
# each get their own group, so none is cancelled or dropped while queued:
# they save the caches every later run reads and publish the image.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

env:
  FORCE_COLOR: "1"
  # The mise release CI uses; local contributors may run any recent mise.
  MISE_VERSION: "2026.10.21"

jobs:
  check:
    name: Check / mise run check
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the tools mise.toml pins (and fails if it cannot), so CI
      # never falls back to another version. Only main saves the cache.
      - name: Set up mise and tools
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Locate the Bun package cache
        id: bun-cache
        run: echo "dir=$(bun pm cache)" >> "$GITHUB_OUTPUT"

      - name: Restore Bun packages
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: mise run setup

      - name: Save Bun packages
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.bun-cache.outputs.dir }}
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      # See `mise tasks info check` or docs/development.md for the list.
      # Exit 2 from the lockfile-age step means the registry could not be
      # reached: not a pass, re-run the job. The read-only token lets zizmor
      # run its online audits (impostor commits, known-vulnerable actions).
      - name: Run checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: mise run check

  image:
    name: Image / build + E2E (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    # Native runners for both architectures (free for public repositories),
    # so arm64 is built and tested without emulation.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      IMAGE: wakewright:ci
      # The build summary in the job page is enough; skip uploading a build
      # record artifact on every run.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built for this runner's architecture and loaded into Docker, not
      # pushed. Pull requests read main's layer cache; only main writes it,
      # one scope per architecture.
      - name: Build the parent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/parent.Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=parent-${{ matrix.arch }}
          cache-to: ${{ github.ref == 'refs/heads/main' && format('type=gha,mode=max,scope=parent-{0}', matrix.arch) || '' }}

      # The parent must stay free of Python (no ML libraries) and of native
      # addons (portable, small). The image has no shell, so inspect its files.
      - name: Check the image has no Python or native addons
        run: |
          id=$(docker create "$IMAGE")
          files=$(docker export "$id" | tar -t)
          docker rm "$id" > /dev/null
          if grep -E '(^|/)python[0-9.]*$|\.node$' <<< "$files"; then
            echo "::error::The parent image contains Python or a native addon (listed above)."
            exit 1
          fi
          docker image ls "$IMAGE" --format 'Image size: {{.Size}}'

      # Run it as a user would: read-only root filesystem, writable /data
      # volume and /tmp, no extra privileges.
      - name: Start the image
        run: |
          docker run -d --name wakewright --read-only --tmpfs /tmp \
            --cap-drop ALL --security-opt no-new-privileges \
            --add-host=host.docker.internal:host-gateway \
            -p 8080:8080 "$IMAGE"
          for _ in $(seq 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' wakewright)
            [ "$status" = healthy ] && break
            sleep 1
          done
          docker inspect -f 'Health: {{.State.Health.Status}}' wakewright
          [ "$status" = healthy ]
          curl -fsS http://localhost:8080/readyz

      # Only Bun: this job needs none of the lint tools in mise.toml.
      - name: Set up mise and Bun
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7
        with:
          version: ${{ env.MISE_VERSION }}
          install_args: bun
          cache_key_prefix: mise-bun
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Install dependencies
        run: mise run setup

      # Only the headless shell: the runner images already have Chrome's
      # system libraries, so no apt step is needed; a missing library fails
      # the test with Playwright's own message. Playwright advises against
      # caching browsers: restoring takes about as long as downloading them.
      - name: Install Chromium headless shell
        run: bunx --bun playwright install --only-shell chromium

      - name: Run the E2E smoke test against the image
        env:
          E2E_BASE_URL: http://localhost:8080
          # The fake device Playwright starts on the runner, as the container sees it.
          E2E_FAKE_KIOSK_URL: http://host.docker.internal:23250
        run: mise run e2e

      - name: Show the container log
        if: always()
        run: docker logs wakewright || true

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-traces-${{ matrix.arch }}
          path: test-results
          retention-days: 7

  # Fails a pull request that adds a dependency with a known vulnerability
  # of moderate severity or worse. It compares the pull request's lockfile
  # with its base, so an advisory published today against a dependency main
  # already has does not fail unrelated pull requests; the daily dependency
  # health workflow reports those instead.
  dependency-review:
    name: Dependencies / review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: never

  # The one check to require on main: it fails unless every job above
  # passed or was skipped by its own `if` (dependency review on pushes).
  ci-ok:
    name: CI OK
    if: always()
    needs: [check, image, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every job to pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $RESULTS; do
            case "$r" in
              success | skipped) ;;
              *) echo "::error::A required job finished with: $r"; exit 1 ;;
            esac
          done

  # Pushes to main only, after every check above passed on that commit:
  # publishes the `edge` image and, for a release commit, the release.
  publish:
    name: Publish
    needs: ci-ok
    # The explicit result check is needed: a bare condition implies
    # success(), which is false whenever any job upstream was skipped (as
    # dependency review is on pushes).
    if: ${{ !cancelled() && needs.ci-ok.result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    # One publish at a time, in order. A queued run that a newer push
    # replaces is not lost work: the newer commit publishes `edge` and, if
    # its version is still untagged, the release.
    concurrency:
      group: publish
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: $/.github/workflows/publish.yml
