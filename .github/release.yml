# Categories for GitHub's generated release notes, which `mise run release`
# writes into CHANGELOG.md. A pull request goes under the first category
# whose label it has; unlabelled ones land in "Other changes".
# See docs/RELEASING.md.
changelog:
  exclude:
    labels:
      - release
      - skip-changelog
  categories:
    - title: Breaking changes
      labels: [breaking]
    - title: Security
      labels: [security]
    - title: New features
      labels: [enhancement]
    - title: Fixes
      labels: [bug]
    - title: Documentation
      labels: [documentation]
    - title: Dependencies
      labels: [dependencies]
    - title: CI and tooling
      labels: [ci]
    - title: Other changes
      labels: ["*"]
