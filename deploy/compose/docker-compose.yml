# Reference Docker Compose file for Wakewright. See docs/getting-started.md.
#
# Before the first start, create the secrets next to this file:
#   mkdir -p secrets
#   openssl rand -base64 32 > secrets/key            # encrypts stored device passwords
#   printf '%s' 'a long admin password' > secrets/admin_password
#   openssl rand -base64 32 > secrets/worker_token   # shared by the parent and the worker
#   chmod 644 secrets/*                              # the containers run as uid 10001
# Or delete the key and admin WAKEWRIGHT__*_FILE lines and their secrets: the
# key is then generated into the data volume and the web UI asks you to
# create the admin.
#
# The worker judges clips (docs/worker.md). It needs no port; it downloads
# its models (about 2.5 GB) into the worker-cache volume on first start.
# Delete the worker service, the WAKEWRIGHT__WORKER__TOKEN_FILE line and the
# worker_token secret to run without judging, or run the worker on another
# machine instead (it only needs to reach the parent).
name: wakewright
services:
  wakewright:
    # A release tag; `edge` is built from every merge to main, for testing.
    image: ghcr.io/lukepoo101/wakewright:0.0.1
    restart: unless-stopped
    ports: ["8080:8080"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes: [wakewright-data:/data]
    environment:
      TZ: Europe/London
      # The address you open in the browser; https:// marks cookies Secure.
      WAKEWRIGHT__SERVER__PUBLIC_URL: http://wakewright.local:8080
      WAKEWRIGHT__SECRET_KEY_FILE: /run/secrets/wakewright_key
      WAKEWRIGHT__ADMIN__PASSWORD_FILE: /run/secrets/wakewright_admin
      WAKEWRIGHT__WORKER__TOKEN_FILE: /run/secrets/wakewright_worker_token
    secrets: [wakewright_key, wakewright_admin, wakewright_worker_token]
  worker:
    # Use the same release tag as the parent. Judging arrived after 0.0.3,
    # so until a release includes it, run both services from `edge`.
    image: ghcr.io/lukepoo101/wakewright-worker:edge
    restart: unless-stopped
    depends_on: [wakewright]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    # Models are downloaded once into this volume (see docs/models.md).
    volumes: [worker-cache:/cache]
    # Finish the clip in hand on `docker compose stop`.
    stop_grace_period: 30s
    environment:
      WAKEWRIGHT_WORKER__PARENT_URL: http://wakewright:8080
      WAKEWRIGHT_WORKER__TOKEN_FILE: /run/secrets/wakewright_worker_token
      WAKEWRIGHT_WORKER__NAME: compose-worker
    secrets: [wakewright_worker_token]
secrets:
  wakewright_key: { file: ./secrets/key }
  wakewright_admin: { file: ./secrets/admin_password }
  wakewright_worker_token: { file: ./secrets/worker_token }
volumes:
  wakewright-data: {}
  worker-cache: {}
