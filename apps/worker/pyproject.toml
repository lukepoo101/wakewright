[project]
name = "wakewright-worker"
# The product version: apps/parent/package.json. `mise run release` sets both;
# scripts/check-versions.ts fails when they differ.
version = "0.3.1"
description = "Wakewright worker: judges wake word clips for the Wakewright parent"
license = "Apache-2.0"
requires-python = ">=3.13,<3.14"
authors = [{ name = "Wakewright contributors" }]
# Every dependency ships wheels for Linux (x86_64, aarch64), macOS and
# Windows (amd64): see docs/worker.md. Exact pins; uv.lock holds the rest.
dependencies = [
  "httpx==0.28.1",
  "numpy==2.5.4",
  "onnx-asr==0.12.0",
  "onnxruntime==1.32.0",
  "pymicro-wakeword==2.5.0",
]

[project.urls]
Homepage = "https://github.com/lukepoo101/wakewright"
Documentation = "https://github.com/lukepoo101/wakewright/blob/main/docs/worker.md"

[project.scripts]
wakewright-worker = "wakewright_worker.cli:main"

[dependency-groups]
dev = [
  "jsonschema==4.26.0",
  "pyright[nodejs]==1.1.414",
  "pytest==9.2.0",
  "ruff==0.17.5",
]

[build-system]
requires = ["uv_build==0.13.7"]
build-backend = "uv_build"

[tool.uv]
# Refuse any distribution uploaded less than 3 days ago, as bunfig.toml does
# for npm. scripts/check_lock_age.py checks uv.lock against the same policy.
exclude-newer = "3 days"
required-version = "==0.13.7"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "S", "BLE", "C4", "PT", "PTH",
  "RET", "TID", "A", "LOG",
]
ignore = [
  "S101",    # asserts narrow types for pyright; nothing relies on them at run time
  "PLR2004", # magic values read fine in tests and signal processing
  "PLR0913", # constructors with keyword-only settings
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S104", "S105", "PLC0415", "RET503"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
# onnxruntime and pymicro-features ship no complete stubs.
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnknownLambdaType = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# The real-model tests download about 2.5 GB; they run only when asked for
# (`mise run worker-models-test`, or CI's worker-models workflow).
addopts = "-m 'not models' --strict-markers"
markers = ["models: downloads and runs the real models (opt-in)"]
